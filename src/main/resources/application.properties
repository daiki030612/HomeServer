# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/homeserver?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.username=${HOMESERVER_DB_USERNAME}
spring.datasource.password=${HOMESERVER_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# アップロード一時保存場所
spring.servlet.multipart.location=E:/HomeServer/temp

# 動画本体
video.storage.path=E:/2022-01-04

# サムネイル
thumbnail.storage.path=E:/2022-01-04/thumbnails

logging.level.org.springframework.web.servlet.resource=TRACE

# アップロード容量制限
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
