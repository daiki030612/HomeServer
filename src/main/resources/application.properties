# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/homeserver?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true
spring.datasource.username=${HOMESERVER_DB_USERNAME}
spring.datasource.password=${HOMESERVER_DB_PASSWORD}

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# アップロード一時保存場所
spring.servlet.multipart.location=${HOMESERVER_UPLOAD_TEMP:E:/HomeServer/temp}

# 動画本体
video.storage.path=${HOMESERVER_VIDEO_STORAGE:E:/2022-01-04}

# サムネイル
thumbnail.storage.path=${HOMESERVER_THUMBNAIL_STORAGE:E:/2022-01-04/thumbnails}

# ストレージ残量警告（使用率または空き容量のどちらかが閾値に達した場合）
storage.monitoring.warning-usage-percent=${STORAGE_WARNING_USAGE_PERCENT:90}
storage.monitoring.warning-free-bytes=${STORAGE_WARNING_FREE_BYTES:10737418240}

# アップロード容量制限
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB

# URL動画インポート（既定5GB、ページHTMLは2MB、FFmpegは30分）
video.url-import.max-bytes=${VIDEO_URL_IMPORT_MAX_BYTES:5368709120}
video.url-import.max-page-bytes=${VIDEO_URL_IMPORT_MAX_PAGE_BYTES:2097152}
video.url-import.ffmpeg-timeout=${VIDEO_URL_IMPORT_FFMPEG_TIMEOUT:PT30M}
video.url-import.user-agent=${VIDEO_URL_IMPORT_USER_AGENT:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0 Safari/537.36}
video.url-import.hls-concurrency=${VIDEO_URL_IMPORT_HLS_CONCURRENCY:6}
video.url-import.job-workers=${VIDEO_URL_IMPORT_JOB_WORKERS:1}
video.url-import.job-progress-interval=${VIDEO_URL_IMPORT_JOB_PROGRESS_INTERVAL:PT1S}
video.url-import.job-history-limit=${VIDEO_URL_IMPORT_JOB_HISTORY_LIMIT:25}

# ブラウザへ内部例外やスタックトレースを公開しない
server.error.include-message=never
server.error.include-stacktrace=never

server.port=8080

# Cross-app navigation. Absolute URLs override host/port discovery for reverse proxies.
navigation.video.url=${VIDEO_APP_URL:}
navigation.image.url=${IMAGE_APP_URL:}
navigation.video-port=${VIDEO_APP_PORT:8080}
navigation.image-port=${IMAGE_APP_PORT:8081}
navigation.video-path=${VIDEO_APP_PATH:/videos}
navigation.image-path=${IMAGE_APP_PATH:/gallery}

# Shared authentication. Set the same secret in both applications (minimum 32 characters).
shared-auth.secret=${SHARED_AUTH_SECRET:}
shared-auth.cookie-name=${SHARED_AUTH_COOKIE_NAME:MEDIA_AUTH}
shared-auth.token-ttl=${SHARED_AUTH_TOKEN_TTL:30m}
shared-auth.cookie-secure=${SHARED_AUTH_COOKIE_SECURE:false}
shared-auth.image-port=${IMAGE_APP_PORT:8081}
shared-auth.image-url=${IMAGE_APP_URL:}
