<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar unified-header">
	<link rel="stylesheet" th:href="@{/css/navigation.css}">
	<link rel="stylesheet" th:href="@{/css/unified-header.css}">
	<link rel="stylesheet" th:href="@{/css/ios-theme.css}">
	<div class="unified-header-inner">
		<a class="brand logo" th:href="@{/videos}">メディア</a>
		<button type="button" class="hamburger-button unified-menu-button" data-header-menu-button
			aria-label="メニューを開く" aria-expanded="false" aria-controls="video-header-menu"><span></span><span></span></button>
		<div class="app-switcher" aria-label="アプリ切り替え">
			<a class="app-switch-link active" th:href="@{/videos}" aria-current="page">動画</a>
			<a class="app-switch-link" data-app-target="image"
				th:attr="data-url=${imageAppUrl},data-port=${imageAppPort},data-path=${imageAppPath}">写真</a>
		</div>
		<form class="header-search" method="get" th:action="@{/videos}" role="search">
			<label class="visually-hidden" for="video-global-search">動画を検索</label>
			<span aria-hidden="true">⌕</span>
			<input id="video-global-search" type="search" name="keyword" th:value="${keyword}" placeholder="動画を検索">
		</form>
		<nav class="unified-nav" aria-label="メインナビゲーション">
			<div class="page-nav unified-menu" id="video-header-menu" data-header-menu>
				<a th:href="@{/videos}">ライブラリ</a>
				<a href="#" onclick="openFolderModal(); return false;">新しいフォルダ</a>
				<a class="button small" th:href="@{/videos/upload(folderId=${currentFolder != null ? currentFolder.id : null})}">アップロード</a>
				<a class="button small" th:href="@{/videos/upload(folderId=${currentFolder != null ? currentFolder.id : null})} + '#url-import'">URLから追加</a>
				<form class="logout-form" th:action="@{/logout}" method="post"><button class="logout-link" type="submit">ログアウト</button></form>
			</div>
		</nav>
		<div class="storage-status unified-storage" th:if="${storageInfo != null and storageInfo.available}"
			th:classappend="${storageInfo != null and storageInfo.warning} ? ' storage-warning'"
			th:title="|使用 ${storageInfo.usedDisplay} / ${storageInfo.totalDisplay} (${storageInfo.usagePercent}%)|">
			<strong class="storage-desktop" th:text="|空き ${storageInfo.freeDisplay} / ${storageInfo.totalDisplay}|">空き容量</strong><strong class="storage-mobile" th:text="|${storageInfo.freeDisplay} 空き|">空き容量</strong><small th:if="${storageInfo.warning}">残量注意</small>
		</div>
	</div>
	<nav class="ios-tabbar" aria-label="メディア">
		<a class="ios-tab active" th:href="@{/videos}" aria-current="page"><span aria-hidden="true">▶︎</span>動画</a>
		<a class="ios-tab" data-app-target="image"
			th:attr="data-url=${imageAppUrl},data-port=${imageAppPort},data-path=${imageAppPath}"><span aria-hidden="true">▣</span>写真</a>
		<a class="ios-tab" th:href="@{/videos/upload(folderId=${currentFolder != null ? currentFolder.id : null})}"><span aria-hidden="true">＋</span>追加</a>
	</nav>
	<script defer th:src="@{/js/app-navigation.js}"></script>
	<script defer th:src="@{/js/header-menu.js}"></script>
</header>
</body>
</html>
