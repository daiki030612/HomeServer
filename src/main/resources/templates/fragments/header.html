<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Header Fragment -->
<header th:fragment="header" class="header">
	<div class="header-inner">
		<a th:href="@{/videos}" class="logo" aria-label="Video Server ホーム">
			<span>VideoServer</span>
		</a>
		<div class="app-switcher" aria-label="アプリ切り替え">
			<a class="app-switch-link active" th:href="@{/videos}" aria-current="page">Video</a>
			<a class="app-switch-link" data-app-target="image"
				th:attr="data-url=${imageAppUrl},data-port=${imageAppPort},data-path=${imageAppPath}">Image</a>
		</div>

		<nav class="nav">

			<!-- スマホ用ハンバーガーボタン -->
			<button type="button" class="hamburger-button" onclick="toggleMobileMenu(event)"
				aria-label="メニューを開く" aria-expanded="false">
				<span></span><span></span>
			</button>


			<div class="mobile-menu">

				<a th:href="@{/videos}">
					ライブラリ
				</a>


				<!-- 検索 -->
				<form class="header-search" th:action="@{/videos}" method="get">

					<input type="text" name="keyword" placeholder="動画を検索..." th:value="${keyword}">

					<button type="submit">
						🔍
					</button>

				</form>


				<!-- 新しいフォルダ -->
				<a href="#" onclick="openFolderModal(); return false;"> 
					新しいフォルダ
				</a>


					<!-- アップロード -->
					<a th:href="@{/videos/upload(
			            folderId=${currentFolder != null ? currentFolder.id : null}
			        )}">
						アップロード
					</a>

					<!-- ログアウト -->
					<form th:action="@{/logout}" method="post" class="logout-form">
						<button type="submit" class="logout-link">ログアウト</button>
					</form>

				</div>

		</nav>


		<script defer th:src="@{/js/app-navigation.js}"></script>
		<script>

			function toggleMobileMenu(event) {
				if (event) event.stopPropagation();

				const menu =
					document.querySelector(".mobile-menu");

				menu.classList.toggle("show");
				document.querySelector(".hamburger-button")
					.setAttribute("aria-expanded", menu.classList.contains("show"));

			}

			document.addEventListener("click", function (event) {
				const menu = document.querySelector(".mobile-menu");
				if (!menu || !menu.classList.contains("show") || event.target.closest(".nav")) return;
				menu.classList.remove("show");
				document.querySelector(".hamburger-button")?.setAttribute("aria-expanded", "false");
			});

		</script>
</header>

</html>
