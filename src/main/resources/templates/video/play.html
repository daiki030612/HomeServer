<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title th:text="${video.title}">動画再生</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/design-system.css}">
	<link rel="stylesheet" th:href="@{/css/play.css}">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>
	<div class="ambient-glow" aria-hidden="true"></div>

	<div class="container">
		<a class="play-back" th:href="@{/videos}">← ライブラリ</a>


		<!-- =========================
	         動画プレイヤー
	    ========================== -->

		<div id="videoPlayerContainer" class="video-player-container">

			<video id="videoPlayer" th:src="@{'/videos/play/' + ${video.id}}" playsinline preload="metadata">

				お使いのブラウザは動画再生に対応していません。

			</video>


			<!-- 中央再生ボタン -->

			<button id="centerPlayButton" class="center-play-button" type="button" aria-label="再生">

				▶

			</button>


			<!-- 2倍速表示 -->

			<div id="speedIndicator" class="speed-indicator">

				×2

			</div>


			<!-- =========================
	             コントロール
	        ========================== -->

			<div class="controls">

				<!-- シークバー -->

				<input id="seekBar" class="seek-bar" type="range" min="0" max="10000" value="0" step="1" aria-label="再生位置">


				<div class="control-bottom">

					<!-- 再生 / 一時停止 -->

					<button id="playButton" class="control-button" type="button" aria-label="再生・一時停止">

						▶

					</button>


					<!-- 再生時間 -->

					<div class="time-display">

						<span id="currentTime">0:00</span>

						<span>/</span>

						<span id="duration">0:00</span>

					</div>


					<!-- 音量 -->

					<div class="volume-control">

						<button id="muteButton" class="control-button volume-button" type="button" aria-label="ミュート">

							🔊

						</button>


						<input id="volumeBar" class="volume-bar" type="range" min="0" max="100" value="100" step="1" aria-label="音量">

					</div>


					<!-- 全画面 -->

					<button id="fullscreenButton" class="control-button" type="button" aria-label="全画面表示">

						⛶

					</button>

				</div>

			</div>

		</div>

	</div>

	<!-- =========================
	     動画情報
	========================== -->

	<div class="video-info">

		<!-- タイトル -->
		<h1 class="video-title" th:text="${video.title}">
			動画タイトル
		</h1>


		<!-- タグ -->
		<div class="video-tags" th:if="${video.tags != null && !video.tags.isEmpty()}">

			<a th:each="tag : ${video.tags}" th:href="@{/videos(keyword=${tag.name})}" class="video-tag"
				th:text="'#' + ${tag.name}">

				#タグ

			</a>

		</div>

	</div>


	<!-- =========================
	     関連動画
	========================== -->

	<div class="related-videos" th:if="${relatedVideos != null && !relatedVideos.isEmpty()}">

		<h2>関連動画</h2>


		<div class="related-video-grid">

			<div class="related-video-card" th:each="related : ${relatedVideos}">

				<a th:href="@{/videos/view/{id}(id=${related.id})}">

					<img th:src="@{'/thumbnails/' + ${related.thumbnailName}}" class="related-thumbnail">


					<div class="related-title" th:text="${related.title}">

						動画タイトル

					</div>

				</a>

			</div>

		</div>

	</div>



	<!-- JavaScript -->

	<script th:src="@{/js/video/play.js}"></script>

</body>

</html>
