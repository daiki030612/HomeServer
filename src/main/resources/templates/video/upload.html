<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Upload Video</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/upload.css}">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>


	<main class="upload-page">

		<section class="upload-card">

			<p class="eyebrow">ADD TO LIBRARY</p>
			<h1>動画をアップロード</h1>

			<p class="upload-description">
				お気に入りの動画を、プライベートライブラリへ追加します。
			</p>

			<form id="upload-form" th:action="@{/videos/upload}" method="post" enctype="multipart/form-data">
				<input type="hidden"
				       id="folderId"
				       name="folderId"
				       th:value="${currentFolder != null ? currentFolder.id : ''}">

				<div class="file-area">

					<input id="file" type="file" name="file" accept="video/*" required>

					<div class="upload-icon" aria-hidden="true">
						↑
					</div>

					<div class="select-video-container">

						<label for="file" class="file-label">

							<div class="select-video-button">
								動画を選択
							</div>

						</label>

					</div>

					<span id="file-name">
						動画を選択してください
					</span>

				</div>

				<button id="upload-button" type="submit" class="upload-button">

					アップロード

				</button>

			</form>


			<!-- アップロード進捗 -->

			<div id="progress-area" class="progress-area">

				<p id="progress-text">
					アップロード中... 0%
				</p>

				<div class="progress-bar-background">

					<div id="progress-bar" class="progress-bar">
					</div>

				</div>

				<p id="progress-size">
					0 MB / 0 MB
				</p>

			</div>

		</section>

		<section class="upload-card url-import-card">
			<p class="eyebrow">IMPORT FROM URL</p>
			<h2>動画ページURLから保存</h2>
			<p class="upload-description">
				公開されたMP4・m3u8 URL、または標準のvideo/source/og:videoを含むページに対応します。
			</p>
			<form id="url-import-form" th:action="@{/videos/import-url}" method="post">
				<input type="hidden" name="folderId"
				       th:value="${currentFolder != null ? currentFolder.id : ''}">
				<label for="video-url">動画ページURL</label>
				<input id="video-url" class="url-input" type="url" name="url"
				       inputmode="url" autocomplete="url" required
				       placeholder="https://example.com/video-page">
				<button id="url-import-button" type="submit" class="upload-button">URLから保存</button>
			</form>
			<div id="url-import-progress" class="url-import-progress" role="status" aria-live="polite" hidden>
				<p id="url-import-status" class="url-import-status">URLを解析しています</p>
				<div class="progress-bar-background" aria-hidden="true">
					<div id="url-import-progress-bar" class="progress-bar"></div>
				</div>
				<div class="url-import-progress-summary">
					<strong id="url-import-percentage">0%</strong>
					<span id="url-import-segments">セグメント情報を取得中</span>
				</div>
				<p id="url-import-bytes" class="url-import-detail">0 B ダウンロード済み</p>
				<p id="url-import-elapsed" class="url-import-detail"></p>
			</div>
		</section>

	</main>


	<!-- アップロード用JavaScript -->
	<script th:src="@{/js/video/upload.js}"></script>

</body>

</html>
