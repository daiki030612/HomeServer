<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Home Server</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- CSRF Token -->
	<meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container">

		<!-- =========================
     パンくずリスト
     ========================= -->

		<div class="breadcrumb">

			<!-- Videos = ルートフォルダー -->
			<a href="/videos" class="breadcrumb-root" ondragover="allowBreadcrumbDrop(event, this)"
				ondragenter="enterBreadcrumbDrop(event, this)" ondragleave="leaveBreadcrumbDrop(event, this)"
				ondrop="dropBreadcrumbVideo(event, this)">

				Videos

			</a>


			<!-- 現在フォルダーがある場合 -->
			<span th:if="${currentFolder != null}">

				<span th:each="folder, stat : ${breadcrumbs}">

					<span>/</span>


					<!-- 現在フォルダー以外 -->
					<a th:if="${!stat.last}" th:href="@{/videos/folder/{id}(id=${folder.id})}" th:text="${folder.name}"
						class="breadcrumb-folder" th:attr="data-id=${folder.id}"
						ondragover="allowBreadcrumbDrop(event, this)" ondragenter="enterBreadcrumbDrop(event, this)"
						ondragleave="leaveBreadcrumbDrop(event, this)" ondrop="dropBreadcrumbVideo(event, this)">

						フォルダー

					</a>


					<!-- 現在のフォルダー -->
					<span th:if="${stat.last}" th:text="${folder.name}">

						現在のフォルダー

					</span>

				</span>

			</span>

		</div>



		<form class="header-search" method="get">

			<input type="text" name="keyword" placeholder="動画を検索..." class="search-input" th:value="${keyword}">

			<button type="submit" class="search-button">
				🔍
			</button>

			<select name="sort" onchange="this.form.submit()">

				<option value="newest" th:selected="${sort == 'newest'}">
					新しい順
				</option>

				<option value="oldest" th:selected="${sort == 'oldest'}">
					古い順
				</option>

				<option value="nameAsc" th:selected="${sort == 'nameAsc'}">
					名前順
				</option>

				<option value="nameDesc" th:selected="${sort == 'nameDesc'}">
					名前逆順
				</option>

			</select>

		</form>
		<!-- ページタイトル -->
		<div class="page-title">
		</div>




		<!-- タグ削除エラー -->
		<div class="tag-delete-error" th:if="${tagDeleteError}" th:text="${tagDeleteError}">
		</div>
		<div class="tag-delete-error" th:if="${folderDeleteError}">

			中身があるフォルダーは削除できません。

		</div>


		<!-- フォルダ一覧 -->
		<div class="folder-grid">

			<div class="folder-card" th:each="folder : ${folders}" th:data-id="${folder.id}"
				oncontextmenu="openFolderMenu(event, this)" ontouchstart="startFolderLongPress(event, this)"
				ontouchend="cancelFolderLongPress()" ontouchmove="cancelFolderLongPress()"
				ondragover="allowVideoDrop(event, this)" ondragenter="enterVideoDrop(event, this)"
				ondragleave="leaveVideoDrop(event, this)" ondrop="dropVideo(event, this)">

				<a class="folder-link" th:href="@{/videos/folder/{id}(id=${folder.id})}">

					<div class="folder-icon"></div>

					<div class="folder-name" th:text="${folder.name}">
						フォルダ名
					</div>

				</a>


				<!-- フォルダメニュー -->

				<div class="folder-menu-dropdown">

					<a href="#" th:data-id="${folder.id}" th:data-name="${folder.name}"
						onclick="openRenameFolderModal(event, this)">

						名前を変更

					</a>


					<form th:action="@{/folders/delete/{id}(id=${folder.id})}" method="post"
						onsubmit="return confirm('このフォルダーを削除しますか？');">
						<button type="submit" class="menu-action-button">削除</button>
					</form>

				</div>

			</div>

		</div>


		<!-- 動画一覧 -->
		<div class="video-grid">

			<div class="video-container">

				<div class="video-card" th:each="video : ${videos}" draggable="true" th:data-id="${video.id}"
					ondragstart="dragVideo(event, this)" ondragend="dragVideoEnd(event, this)">

					<!-- 動画サムネイル -->
					<a class="thumbnail-link" th:href="@{/videos/view/{id}(id=${video.id})}">

						<img class="thumbnail" th:src="@{'/thumbnails/' + ${video.thumbnailName}}">

						<div class="play-overlay">
							▶
						</div>

						<!-- PCのみ表示 -->
						<div class="title-overlay" th:text="${video.title}">
							動画タイトル
						</div>

					</a>


					<!-- 動画メニュー -->
					<div class="video-menu">

						<button type="button" class="menu-button" onclick="toggleMenu(event, this)">

							<span class="pc-menu">…</span>
							<span class="sp-menu">⋮</span>

						</button>


						<div class="menu-dropdown">

							<!-- 名前・タグ編集 -->
							<a href="#" class="edit-video-button" th:data-id="${video.id}"
								th:data-title="${video.title}"
								th:data-tags="${#strings.listJoin(video.tags.![name], ',')}"
								onclick="openEditModalFromButton(event, this)">

								名前・タグを編集

							</a>


							<!-- フォルダーへ移動 -->
							<a href="#" class="move-video-button" th:data-id="${video.id}"
								onclick="openMoveFolderModal(event, this)">

								フォルダーへ移動

							</a>


							<!-- 動画削除 -->
							<form th:action="@{/videos/delete/{id}(id=${video.id})}" method="post"
								onsubmit="return confirm('この動画を削除しますか？');">
								<button type="submit" class="menu-action-button">削除</button>
							</form>

						</div>

					</div>

				</div>

			</div>

		</div>


		<!-- =========================
	         動画編集モーダル
	         ========================= -->

		<div id="editModal" class="modal">

			<div class="modal-content">

				<h2>動画を編集</h2>


				<form th:action="@{/videos/edit}" method="post">

					<!-- 動画ID -->
					<input type="hidden" id="editId" name="id">


					<!-- タイトル -->
					<input type="text" id="editTitle" name="title" placeholder="動画タイトル" required>


					<!-- タグ -->
					<div class="tag-input-wrapper">

						<!-- 選択中のタグ -->
						<div id="tag-chips" class="tag-chips">
						</div>


						<!-- タグ入力 -->
						<input type="text" id="tagInput" class="tag-input" placeholder="タグを入力してEnter"
							autocomplete="off">


						<!-- Spring Bootへ送信 -->
						<input type="hidden" id="editTags" name="tags">


						<!-- 過去に登録したタグ -->
						<div id="tag-suggestions" class="tag-suggestions">

							<div class="tag-suggestion" th:each="tag : ${tags}" th:data-tag="${tag.name}">

								<span th:text="${tag.name}">
									タグ名
								</span>


								<!-- タグ削除 -->
								<form class="tag-delete-form" th:action="@{/videos/tag/delete/{id}(id=${tag.id})}"
									method="post" th:attr="data-tag=${tag.name}" onsubmit="
	                                   if (currentTags.includes(this.dataset.tag)) {
	                                       alert('このタグは現在選択されているため削除できません。');
	                                       return false;
	                                   }

	                                   return confirm('このタグを削除しますか？');
	                               " onmousedown="event.stopPropagation();">
									<button type="submit" class="tag-delete-button">×</button>
								</form>

							</div>

						</div>

					</div>


					<button type="submit">
						保存
					</button>

					<button type="button" onclick="closeEditModal()">
						キャンセル
					</button>

				</form>

			</div>

		</div>
		<!-- =========================
		     フォルダー移動モーダル
		     ========================= -->

		<div id="moveFolderModal" class="modal">

			<div class="modal-content">

				<h2>動画を移動</h2>


				<!-- 動画ID -->
				<input type="hidden" id="moveVideoId">


				<!-- 移動先フォルダー -->

				<label for="moveFolderId">
					移動先
				</label>


				<select id="moveFolderId">

					<!-- メインページ -->
					<option value="">
						メインページ
					</option>


					<!-- フォルダー一覧 -->
					<option th:each="folder : ${allFolders}" th:value="${folder.id}" th:text="'📁 ' + ${folder.name}">

						フォルダー名

					</option>

				</select>


				<!-- ボタン -->

				<button type="button" onclick="moveVideo()">

					移動

				</button>


				<button type="button" onclick="closeMoveFolderModal()">

					キャンセル

				</button>

			</div>

		</div>

		<!-- =========================
		     フォルダ作成モーダル
		     ========================= -->

		<div id="folderModal" class="modal">

			<div class="modal-content">

				<h2>新しいフォルダ</h2>

				<form th:action="@{/folders/create}" method="post">

					<!-- 現在のフォルダID -->
					<input type="hidden" name="parentId" th:value="${currentFolder != null ? currentFolder.id : ''}">

					<!-- フォルダ名 -->
					<input type="text" name="name" placeholder="フォルダ名" required>

					<button type="submit">
						作成
					</button>

					<button type="button" onclick="closeFolderModal()">
						キャンセル
					</button>

				</form>

			</div>

		</div>

		<!-- =========================
		     フォルダー名前変更モーダル
		     ========================= -->

		<div id="renameFolderModal" class="modal">

			<div class="modal-content">

				<h2>フォルダー名を変更</h2>


				<form th:action="@{/folders/rename}" method="post">

					<!-- フォルダーID -->
					<input type="hidden" id="renameFolderId" name="id">
					<input type="hidden" name="parentId" th:value="${currentFolder != null ? currentFolder.id : ''}">


					<!-- フォルダー名 -->
					<input type="text" id="renameFolderName" name="name" placeholder="フォルダー名" required>


					<button type="submit">
						保存
					</button>


					<button type="button" onclick="closeRenameFolderModal()">

						キャンセル

					</button>

				</form>

			</div>

		</div>


		<!-- JavaScript -->
		<script th:src="@{/js/video/video-list.js}"></script>

	</div>

</body>

</html>
