<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Home Server</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/design-system.css}">
	<link rel="stylesheet" th:href="@{/css/video-library.css}">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<!-- CSRF Token -->
	<meta name="_csrf" th:content="${_csrf.token}"/>
	<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
	<meta name="video-move-url" th:content="@{/videos/move}"/>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<div class="container">
		<div class="page-heading">
			<div>
				<p class="eyebrow">LIBRARY</p>
				<h1 th:text="${currentFolder != null ? currentFolder.name : '動画一覧'}">動画一覧</h1>
			</div>
			<div class="toolbar-actions" aria-label="ライブラリ操作">
				<button class="button" type="button" onclick="openFolderModal()">＋ フォルダ</button>
				<a class="button" th:href="@{/videos/upload(folderId=${currentFolder != null ? currentFolder.id : null})} + '#url-import'">URL保存</a>
				<a class="button primary" th:href="@{/videos/upload(folderId=${currentFolder != null ? currentFolder.id : null})}">＋ アップロード</a>
			</div>
		</div>

		<!-- =========================
     パンくずリスト
     ========================= -->

		<div class="breadcrumb">

			<!-- Videos = ルートフォルダー -->
			<a th:href="@{/videos}" class="breadcrumb-root" ondragover="allowBreadcrumbDrop(event, this)"
				ondragenter="enterBreadcrumbDrop(event, this)" ondragleave="leaveBreadcrumbDrop(event, this)"
				ondrop="dropBreadcrumbVideo(event, this)">

				Videos

			</a>


			<!-- 現在フォルダーがある場合 -->
			<span th:if="${currentFolder != null}">

				<span th:each="folder, stat : ${breadcrumbs}">

					<span>/</span>


					<!-- 現在フォルダー以外 -->
					<a th:if="${!stat.last}" th:href="@{/videos/folder/{id}(id=${folder.id})}" th:text="${folder.name}"
						class="breadcrumb-folder" th:attr="data-id=${folder.id}"
						ondragover="allowBreadcrumbDrop(event, this)" ondragenter="enterBreadcrumbDrop(event, this)"
						ondragleave="leaveBreadcrumbDrop(event, this)" ondrop="dropBreadcrumbVideo(event, this)">

						フォルダー

					</a>


					<!-- 現在のフォルダー -->
					<span th:if="${stat.last}" th:text="${folder.name}">

						現在のフォルダー

					</span>

				</span>

			</span>

		</div>



		<form class="gallery-filters video-filters" method="get" aria-label="動画を検索・絞り込み">
			<label>
				検索
				<input type="search" name="keyword" placeholder="動画タイトル・タグなどを検索" class="search-input" th:value="${keyword}">
			</label>
			<label>
				タグ
				<select name="tag">
					<option value="">すべて</option>
					<option th:each="filterTag : ${tags}" th:value="${filterTag.name}" th:text="${filterTag.name}"
						th:selected="${filterTag.name == selectedTag}">タグ</option>
				</select>
			</label>
			<label>
				並び順
				<select name="sort">

				<option value="newest" th:selected="${sort == 'newest'}">
					新しい順
				</option>

				<option value="oldest" th:selected="${sort == 'oldest'}">
					古い順
				</option>

				<option value="nameAsc" th:selected="${sort == 'nameAsc'}">
					名前順
				</option>

				<option value="nameDesc" th:selected="${sort == 'nameDesc'}">
					名前逆順
				</option>

				</select>
			</label>
			<label class="favorite-filter">
				<span>お気に入り</span>
				<span class="favorite-filter-control">
					<input type="checkbox" name="favorite" value="true" th:checked="${favoriteOnly}"
						onchange="applyFavoriteFilter(this)">
					お気に入りのみ
				</span>
			</label>
			<button type="submit" class="button primary filter-submit">検索</button>
		</form>




		<!-- タグ削除エラー -->
		<div class="tag-delete-error" th:if="${tagDeleteError}" th:text="${tagDeleteError}">
		</div>
		<div class="tag-delete-error" th:if="${folderDeleteError}">

			中身があるフォルダーは削除できません。

		</div>


		<!-- フォルダ一覧 -->
		<div class="section-heading" th:if="${!#lists.isEmpty(folders)}">
			<h2>フォルダ</h2>
			<span th:text="|${#lists.size(folders)}件|">0件</span>
		</div>
		<div class="folder-grid">

			<div class="folder-card" th:each="folder : ${folders}" th:data-id="${folder.id}"
				ondragover="allowVideoDrop(event, this)" ondragenter="enterVideoDrop(event, this)"
				ondragleave="leaveVideoDrop(event, this)" ondrop="dropVideo(event, this)">

				<a class="folder-link" th:href="@{/videos/folder/{id}(id=${folder.id})}"
					th:aria-label="|${folder.name} フォルダを開く|">

					<div class="folder-icon" aria-hidden="true"></div>

					<div class="folder-name" th:text="${folder.name}">
						フォルダ名
					</div>
					<div class="folder-meta">フォルダ</div>

				</a>
				<button type="button" class="folder-menu-button" onclick="toggleFolderMenu(event, this)"
					th:id="|folder-menu-button-${folder.id}|" th:aria-controls="|folder-menu-${folder.id}|"
					th:aria-label="|${folder.name} の操作メニュー|"
					aria-haspopup="menu" aria-expanded="false">…</button>


				<!-- フォルダメニュー -->

				<div class="folder-menu-dropdown" role="menu" th:id="|folder-menu-${folder.id}|"
					th:aria-labelledby="|folder-menu-button-${folder.id}|">
					<div class="action-sheet-title" aria-hidden="true" th:text="${folder.name}"></div>
					<a class="folder-download-link" th:href="@{/folders/{id}/download(id=${folder.id})}"
						role="menuitem">ダウンロード</a>

					<a href="#" th:data-id="${folder.id}" th:data-name="${folder.name}"
						onclick="openRenameFolderModal(event, this)" role="menuitem">

						名前を変更

					</a>


					<form th:action="@{/folders/delete/{id}(id=${folder.id})}" method="post"
						onsubmit="event.stopPropagation(); return confirm('このフォルダーを削除しますか？');">
						<button type="submit" class="menu-action-button danger-action" role="menuitem">削除</button>
					</form>
					<button type="button" class="action-sheet-cancel" onclick="closeFolderMenus()">キャンセル</button>

				</div>

			</div>

		</div>


		<!-- 動画一覧 -->
		<div class="section-heading" th:if="${!#lists.isEmpty(videos)}">
			<h2>動画</h2>
			<span th:text="|${#lists.size(videos)}件|">0件</span>
		</div>
		<div class="video-grid">

			<div class="video-container">

				<article class="video-card" th:each="video : ${videos}" draggable="true" th:data-id="${video.id}"
					ondragstart="dragVideo(event, this)" ondragend="dragVideoEnd(event, this)">

					<a class="video-card-link" th:href="@{/videos/view/{id}(id=${video.id})}">
						<div class="thumbnail-link">

						<img class="thumbnail" th:src="@{'/thumbnails/' + ${video.thumbnailName}}"
							th:alt="${video.title}" loading="lazy">

						<div class="play-overlay">
							▶
						</div>

						</div>
						<div class="video-card-body">
							<h2 class="video-card-title" th:text="${video.title}">動画タイトル</h2>
							<div class="video-card-meta">
								<span class="media-kind">動画</span>
								<time th:if="${video.createdAt != null}"
									th:text="${#temporals.format(video.createdAt, 'yyyy/MM/dd')}">2026/01/01</time>
							</div>
							<div class="video-card-tags" th:if="${video.tags != null and !video.tags.isEmpty()}">
								<span class="video-tag-chip" th:each="cardTag, stat : ${video.tags}" th:if="${stat.index < 2}"
									th:text="'#' + ${cardTag.name}">#tag</span>
								<span class="video-tag-more" th:if="${#sets.size(video.tags) > 2}"
									th:text="${'+' + (#sets.size(video.tags) - 2)}">+1</span>
							</div>
						</div>
					</a>

					<button type="button" class="favorite-button"
						th:classappend="${video.favorite} ? ' is-favorite'"
						th:data-favorite="${video.favorite}"
						th:data-url="@{/videos/{id}/favorite(id=${video.id})}"
						th:aria-pressed="${video.favorite}"
						th:aria-label="${video.favorite} ? 'お気に入りから削除' : 'お気に入りに追加'"
						draggable="false" onpointerdown="event.stopPropagation()"
						onclick="updateVideoFavorite(event, this)">
						<span aria-hidden="true" th:text="${video.favorite} ? '♥' : '♡'">♡</span>
					</button>


					<!-- 動画メニュー -->
					<div class="video-menu">

						<button type="button" class="menu-button" onclick="toggleMenu(event, this)">

							<span class="visually-hidden">動画の操作メニュー</span>

							<span class="pc-menu">…</span>
							<span class="sp-menu">⋮</span>

						</button>


						<div class="menu-dropdown">
							<div class="action-sheet-title" aria-hidden="true"></div>
							<a class="video-download-link" th:href="@{/videos/{id}/download(id=${video.id})}">
								ダウンロード
							</a>

							<!-- 名前・タグ編集 -->
							<a href="#" class="edit-video-button" th:data-id="${video.id}"
								th:data-title="${video.title}"
								th:data-tags="${#strings.listJoin(video.tags.![name], ',')}"
								onclick="openEditModalFromButton(event, this)">

								名前・タグを編集

							</a>


							<!-- フォルダーへ移動 -->
							<a href="#" class="move-video-button" th:data-id="${video.id}"
								th:data-title="${video.title}"
								th:data-current-folder-id="${video.folder != null ? video.folder.id : ''}"
								th:data-current-folder-name="${video.folder != null ? video.folder.name : 'ライブラリ（ルート）'}"
								onclick="openMoveFolderModal(event, this)">

								フォルダーへ移動

							</a>


							<!-- 動画削除 -->
							<form class="video-delete-form" th:action="@{/videos/delete/{id}(id=${video.id})}" method="post"
								onsubmit="event.stopPropagation(); return confirm('この動画を削除しますか？');">
								<button type="submit" class="menu-action-button danger-action">削除</button>
							</form>

							<button type="button" class="action-sheet-cancel" onclick="closeVideoMenus()">キャンセル</button>

						</div>

					</div>

				</article>

			</div>

		</div>
		<div class="library-empty" th:if="${#lists.isEmpty(folders) and #lists.isEmpty(videos)}">
			<h2>ライブラリは空です</h2>
			<p>動画をアップロードするか、新しいフォルダを作成してください。</p>
		</div>


		<!-- =========================
	         動画編集モーダル
	         ========================= -->

		<div id="editModal" class="modal">

			<div class="modal-content">

				<h2>動画を編集</h2>


				<form id="videoEditForm" th:action="@{/videos/edit}" method="post">

					<!-- 動画ID -->
					<input type="hidden" id="editId" name="id">


					<!-- タイトル -->
					<input type="text" id="editTitle" name="title" placeholder="動画タイトル" required>


					<!-- タグ -->
					<div class="tag-input-wrapper">

						<!-- 選択中のタグ -->
						<div id="tag-chips" class="tag-chips">
						</div>


						<!-- タグ入力 -->
						<input type="text" id="tagInput" class="tag-input" placeholder="タグを入力してEnter"
							autocomplete="off">


						<!-- Spring Bootへ送信 -->
						<input type="hidden" id="editTags" name="tags">


						<!-- 過去に登録したタグ -->
						<div id="tag-suggestions" class="tag-suggestions">

							<div class="tag-suggestion" th:each="tag : ${tags}" th:data-tag="${tag.name}">

								<span th:text="${tag.name}">
									タグ名
								</span>


								<!-- タグ削除 -->
								<button type="submit" class="tag-delete-button" formmethod="post"
									th:formaction="@{/videos/tag/delete/{id}(id=${tag.id})}"
									th:data-tag="${tag.name}" onclick="
	                                   if (currentTags.includes(this.dataset.tag)) {
	                                       alert('このタグは現在選択されているため削除できません。');
	                                       return false;
	                                   }

	                                   return confirm('このタグを削除しますか？');
	                               " onmousedown="event.stopPropagation();">×</button>

							</div>

						</div>

					</div>


					<button type="submit">
						保存
					</button>

					<button type="button" onclick="closeEditModal()">
						キャンセル
					</button>

				</form>

			</div>

		</div>
		<!-- =========================
		     フォルダー移動モーダル
		     ========================= -->

		<div id="moveFolderModal" class="modal" role="dialog" aria-modal="true"
			aria-labelledby="moveFolderTitle">

			<div class="modal-content move-folder-sheet">

				<h2 id="moveFolderTitle">動画を移動</h2>
				<p id="moveVideoTitle" class="move-video-title"></p>
				<p class="move-current-location">
					現在の場所: <strong id="moveCurrentFolder"></strong>
				</p>

				<input type="hidden" id="moveVideoId">
				<input type="hidden" id="moveCurrentFolderId">
				<input type="hidden" id="moveTargetFolderId">

				<div class="move-destination-heading">移動先を選択</div>
				<div class="move-destination-list" role="listbox" aria-label="移動先フォルダー">
					<button type="button" class="move-destination-button" data-folder-id=""
						data-folder-name="ライブラリ（ルート）" onclick="selectMoveDestination(this)">
						<span>⌂ ライブラリ（ルート）</span><span class="move-current-badge">現在</span>
					</button>
					<button type="button" class="move-destination-button" th:each="folder : ${allFolders}"
						th:data-folder-id="${folder.id}" th:data-folder-name="${folder.name}"
						onclick="selectMoveDestination(this)">
						<span th:text="'📁 ' + ${folder.name}">📁 フォルダー名</span>
						<span class="move-current-badge">現在</span>
					</button>
				</div>

				<p id="moveFolderStatus" class="move-folder-status" role="status" aria-live="polite"></p>

				<div class="move-folder-actions">
					<button type="button" id="moveFolderSubmit" onclick="moveVideo()" disabled>移動</button>
					<button type="button" onclick="closeMoveFolderModal()">キャンセル</button>
				</div>

			</div>

		</div>
		<div id="videoMenuBackdrop" class="video-menu-backdrop" onclick="closeAllMediaMenus()" aria-hidden="true"></div>

		<!-- =========================
		     フォルダ作成モーダル
		     ========================= -->

		<div id="folderModal" class="modal">

			<div class="modal-content">

				<h2>新しいフォルダ</h2>

				<form th:action="@{/folders/create}" method="post">

					<!-- 現在のフォルダID -->
					<input type="hidden" name="parentId" th:value="${currentFolder != null ? currentFolder.id : ''}">

					<!-- フォルダ名 -->
					<input type="text" name="name" placeholder="フォルダ名" required>

					<button type="submit">
						作成
					</button>

					<button type="button" onclick="closeFolderModal()">
						キャンセル
					</button>

				</form>

			</div>

		</div>

		<!-- =========================
		     フォルダー名前変更モーダル
		     ========================= -->

		<div id="renameFolderModal" class="modal">

			<div class="modal-content">

				<h2>フォルダー名を変更</h2>


				<form th:action="@{/folders/rename}" method="post">

					<!-- フォルダーID -->
					<input type="hidden" id="renameFolderId" name="id">
					<input type="hidden" name="parentId" th:value="${currentFolder != null ? currentFolder.id : ''}">


					<!-- フォルダー名 -->
					<input type="text" id="renameFolderName" name="name" placeholder="フォルダー名" required>


					<button type="submit">
						保存
					</button>


					<button type="button" onclick="closeRenameFolderModal()">

						キャンセル

					</button>

				</form>

			</div>

		</div>


		<!-- JavaScript -->
		<div id="favoriteStatus" class="favorite-status" role="status" aria-live="polite"></div>
		<script th:src="@{/js/video/video-list.js}"></script>

	</div>

</body>

</html>
